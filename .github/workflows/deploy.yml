name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Redeploy after the screenshot workflow commits new images.
  workflow_run:
    workflows: ["Capture project screenshots"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install and build
        env:
          # Optional: add a repository variable named FORM_ENDPOINT to make the contact form send messages.
          VITE_FORM_ENDPOINT: ${{ vars.FORM_ENDPOINT }}
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          if [ "${REPO,,}" = "${OWNER}.github.io" ]; then
            export VITE_BASE="/" SITE_URL="https://${OWNER}.github.io"
          else
            export VITE_BASE="/${REPO}/" SITE_URL="https://${OWNER}.github.io/${REPO}"
          fi
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
